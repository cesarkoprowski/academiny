services:
  db:
    image: postgres:16
    container_name: academiny_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: academiny
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data16

volumes:
  postgres_data:
    driver: local
