services:
  backend:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT_BACKEND}:3000"
    volumes:
      - ./:/app           # Monta apenas o código, não node_modules
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT_FRONTEND}:5173"
    volumes:
      - ./:/app           # Monta o código do frontend
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
