  #     - postgres_data:/var/lib/postgresql/data16

  backend:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT_BACKEND}:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/server/node_modules
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    ports:
      - "${PORT_FRONTEND}:5173"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/client/node_modules
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
